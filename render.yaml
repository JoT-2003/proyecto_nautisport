# Despliegue del backend NautiSport en Render
# Uso: Render Dashboard -> New -> Blueprint -> seleccionar este repositorio.
services:
  - type: web
    name: nautisport-backend
    runtime: node
    plan: free
    rootDir: nautisport-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Pegar aquí la URL de Supabase (Session pooler, puerto 5432, con ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Render genera un secreto aleatorio para firmar los JWT
      - key: JWT_SECRET
        generateValue: true
